<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/generativeAiDarkLogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents</title>
    <script>
      (function () {
        try {
          // When embedded, the host passes its theme via a `shellTheme` param, which
          // may sit in the hash query. Prefer it over the stored preference so there's no flash of
          // the wrong theme before React mounts.
          var hash = window.location.hash;
          var hashQuery = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?') + 1) : '';
          var shellTheme =
            new URLSearchParams(window.location.search).get('shellTheme') ||
            new URLSearchParams(hashQuery).get('shellTheme');
          var isDark = shellTheme ? shellTheme === 'dark' : localStorage.getItem('theme-preference') === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
    <!-- C3 Theme CSS -->
    <link rel="stylesheet" href="styles/css/c3-theme.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
